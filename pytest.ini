[pytest]
# Pytest configuration for NaviSsurance tests

# Pulse private memory visibility + Shield Security/Compliance surface awareness
# Test discovery (avoid collecting ad-hoc integration scripts)
testpaths = tests
python_files = test_*.py

# Output options
# -p no:cacheprovider avoids cache permission warnings (e.g. under Dropbox)
addopts =
    -ra
    --tb=short
    -p no:cacheprovider
    -m "not qt"

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    qt: marks tests that require Qt application

minversion = 7.0


