[pytest]
# Pytest configuration for NaviSsurance tests

# Test discovery
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
# -p no:cacheprovider avoids cache permission warnings (e.g. under Dropbox)
addopts = 
    -v
    --tb=short
    --strict-markers
    -p no:cacheprovider
    --disable-warnings
    --color=yes

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    qt: marks tests that require Qt application (e.g. ChiefOfStaffTab)

# Minimum version
minversion = 7.0


